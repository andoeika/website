<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Installation | Eika Ando</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 40px 5vw;
    }
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 60px 5vw;
}

.gallery img {
    width: 100%;
    display: block;
}
    header a {
      color: #222222;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
    }

    main {
      width: min(100% - 48px, 900px);
      margin: 100px auto 140px;
    }

    h1 {
      margin-bottom: 100px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 6vw, 68px);
      font-weight: 400;
    }

    .installation-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      margin-bottom: 46px;
      font-size: 22px;
      letter-spacing: 0.08em;
    }

    .installation-entry img {
      display: block;
      width: min(72vw, 620px);
      max-height: 72vh;
      object-fit: contain;
    }

    .more-link {
      margin-top: 42px;
      color: #222222;
      text-decoration: none;
      font-size: 16px;
      letter-spacing: 0.03em;
    }

    @media (max-width: 700px) {
      header {
        padding: 28px 7vw;
      }

      main {
        width: min(100% - 36px, 900px);
        margin-top: 80px;
      }

      h1 {
        margin-bottom: 80px;
      }

      .installation-entry img {
        width: 84vw;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Home</a>
  </header>

  <main>
<section class="installation-page">

  <div class="installation-header">
    <h1>Installation 02</h1>
    <p>2025<br>kumamoto, Japan</p>
  </div>

  <div class="gallery">
<img src="images/installation02/installation02-01.jpeg" alt="">
<img src="images/installation02/installation02-02.jpeg" alt="">
<img src="images/installation02/installation02-03.jpeg" alt="">
<img src="images/installation02/installation02-04.jpeg" alt="">
<img src="images/installation02/installation02-05.jpeg" alt="">
<img src="images/installation02/installation02-06.jpeg" alt="">
<img src="images/installation02/installation02-07.jpeg" alt="">
<img src="images/installation02/installation02-08.jpeg" alt="">
<img src="images/installation02/installation02-09.jpeg" alt="">
<img src="images/installation02/installation02-10.jpeg" alt="">
  </div>

</section>
  </main>

</body>
</html>
