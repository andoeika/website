<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Installation | Eika Ando</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 30px 4vw 20px;
      font-size:12px;
      opacity:0.6;
    }
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 60px 5vw;
}

.gallery img {
    width: 100%;
    display: block;
}
    header a {
      color: #222222;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
    }

    main {
      width: min(100% - 48px, 900px);
      margin: 100px auto 140px;
    }

h1 {
    margin-bottom: 120px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(34px, 5vw, 56px);
    font-weight: 300;
    letter-spacing: 0.08em;
    line-height: 1.15;
}

.installation-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      margin-bottom: 46px;
      font-size: 22px;
      letter-spacing: 0.08em;
    }

.installation-entry img {
    display: block;
    width: min(92vw, 1200px);
    max-height: 88vh;
    object-fit: contain;
}
    .more-link {
      margin-top: 42px;
      color: #222222;
      text-decoration: none;
      font-size: 16px;
      letter-spacing: 0.03em;
    }

    @media (max-width: 700px) {
      header {
        padding: 28px 7vw;
      }

      main {
        width: min(100% - 36px, 900px);
        margin-top: 80px;
      }

      h1 {
        margin-bottom: 80px;
      }

      .installation-entry img {
        width: 84vw;
      }
    }

/* ===== Version 2 ===== */
.installation-header{
  padding-bottom:0px !important;
margin-left:-120px;
}

.installation-header p{
    margin-left:-70px;
}

.installation-header h1{
  margin-left:-70px;
margin-bottom:50px;
    font-size: clamp(24px,3.2vw,38px);
    font-weight: 200;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

    .gallery{ 
    display:flex !important;
    flex-direction:column !important;
    align-items:center;
    gap:0 !important;
    margin-top:-60px !important;
}

.gallery img{
    width:min(72vw,900px) !important;
    margin-bottom:260px !important;
}

/* 1枚目 */
.gallery img:first-child{
    width:min(92vw,1400px) !important;
}

.gallery img:nth-child(1){
  width:94vw !important;
}

/* 2枚目：小さく */
.gallery img:nth-child(2){
  width:min(30vw,340px) !important;
}

/* 5枚目：静かに */
.gallery img:nth-child(5){
    width:min(70vw,800px) !important;
}

/* 6枚目 */
.gallery img:nth-child(6){
    width:min(72vw,900px) !important;
}

/* 3枚目：中〜大 */
.gallery img:nth-child(3){
  width:min(90vw,1400px) !important;
}

/* 7枚目 */
.gallery img:nth-child(7){
    width:min(26vw,300px) !important;
}

/* 8枚目 */
.gallery img:nth-child(8){
    width:min(72vw,950px) !important;
}
