<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | EIKA ANDO</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: "Helvetica Neue", Arial, sans-serif;
      color:#222;
      background:#fff;
      line-height:1.8;
    }

    .container{
      max-width:700px;
      margin:0 auto;
      padding:60px 30px 100px;
    }

    .home{
      text-decoration:none;
      color:#222;
      font-size:15px;
    }

    h1{
      font-size:42px;
      font-weight:300;
      margin-top:100px;
      margin-bottom:40px;
    }

    .intro{
      font-size:16px;
      color:#666;
      margin-bottom:80px;
      line-height:2;
    }

    label{
      display:block;
      margin-top:40px;
      margin-bottom:10px;
      font-size:15px;
    }

    input,
    textarea{
      width:100%;
      border:none;
      border-bottom:1px solid #999;
      padding:12px 0;
      font-size:16px;
      background:transparent;
      outline:none;
    }

    textarea{
      min-height:180px;
      resize:vertical;
    }

    .send{
      display:inline-block;
      margin-top:70px;
      text-decoration:none;
      color:#222;
      font-size:16px;
      letter-spacing:0.08em;
    }

    footer{
      margin-top:120px;
      color:#777;
      font-size:15px;
    }

    footer a{
      color:#777;
      text-decoration:none;
      margin-right:20px;
    }
  </style>

</head>

<body>

<div class="container">

<a href="index.html" class="home">← Home</a>

<h1>Contact</h1>

<p class="intro">
展示・空間装飾・制作のご相談など、<br>
お気軽にご連絡ください。
</p>

<form>

<label>Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Message</label>
<textarea></textarea>

<a href="#" class="send">Send →</a>

</form>

<footer>
<a href="mailto:あなたのメールアドレス">✉︎ Email</a>
<a href="https://instagram.com/あなたのアカウント" target="_blank">Instagram</a>
</footer>

</div>

</body>
</html>
