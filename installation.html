  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 40px 5vw;
    }
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 60px 5vw;
}

.gallery img {
    width: 100%;
    display: block;
}
    header a {
      color: #222222;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
    }

    main {
      width: min(100% - 48px, 900px);
      margin: 100px auto 140px;
    }

    h1 {
      margin-bottom: 100px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 6vw, 68px);
      font-weight: 400;
    }

    .installation-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      margin-bottom: 46px;
      font-size: 22px;
      letter-spacing: 0.08em;
    }

    .installation-entry img {
      display: block;
      width: min(72vw, 620px);
      max-height: 72vh;
      object-fit: contain;
    }

    .more-link {
      margin-top: 42px;
      color: #222222;
      text-decoration: none;
      font-size: 16px;
      letter-spacing: 0.03em;
    }

    @media (max-width: 700px) {
      header {
        padding: 28px 7vw;
      }

      main {
        width: min(100% - 36px, 900px);
        margin-top: 80px;
      }

      h1 {
        margin-bottom: 80px;
      }

      .installation-entry img {
        width: 84vw;
      }
    }
  </style>
</head>
