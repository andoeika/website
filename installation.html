<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Installation | Eika Ando</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 40px 5vw;
    }

    header a {
      color: #222222;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
    }

    main {
      width: min(90vw, 1200px);
      margin: 80px auto 160px;
    }

    h1 {
      margin-bottom: 120px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 5vw, 58px);
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    .installation-list {
      display: flex;
      flex-direction: column;
      gap: 180px;
    }

    .installation-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .installation-entry a {
      color: #222222;
      text-decoration: none;
    }

    .installation-entry img {
      display: block;
      width: min(82vw, 1000px);
      max-height: 82vh;
      object-fit: contain;
    }

    .installation-info {
      width: min(82vw, 1000px);
      margin-top: 36px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
    }

    .number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 300;
      letter-spacing: 0.12em;
    }

    .place {
      font-size: 14px;
      line-height: 1.45;
      text-align: right;
    }

    @media (max-width: 700px) {
      header {
        padding: 28px 7vw;
      }

      main {
        width: 86vw;
        margin-top: 70px;
      }

      h1 {
        margin-bottom: 90px;
      }

      .installation-list {
        gap: 120px;
      }

      .installation-entry img {
        width: 86vw;
      }

      .installation-info {
        width: 86vw;
        margin-top: 24px;
      }

      .number {
        font-size: 21px;
      }

      .place {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Home</a>
  </header>

  <main>

    <h1>Installation</h1>

    <div class="installation-list">

      <article class="installation-entry">
        <a href="installation01.html">
          <img
            src="images/installation01/AmazonPhotos/installation01-1.jpeg"
            alt="Installation 01"
          >

          <div class="installation-info">
            <p class="number">01</p>

            <p class="place">
              2024<br>
              Yame, Fukuoka, Japan
            </p>
          </div>
        </a>
      </article>

      <article class="installation-entry">
        <a href="installation02.html">
          <img
            src="images/installation02/installation02-01.jpeg"
            alt="Installation 02"
          >

          <div class="installation-info">
            <p class="number">02</p>

            <p class="place">
              2025<br>
              Kumamoto, Japan
            </p>
          </div>
        </a>
      </article>

    </div>

  </main>

</body>
</html>
