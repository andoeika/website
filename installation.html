<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installation 01 | Eika Ando</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: #fff;
      color: #202020;
      font-family: Arial, Helvetica, sans-serif;
    }
    header {
      padding: 34px 4vw;
    }
    header a {
      color: inherit;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
    }
    main {
      width: 100%;
      overflow: hidden;
    }
    .intro {
      width: min(92vw, 1320px);
      margin: 11vh auto 20vh;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 40px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(46px, 7vw, 104px);
      font-weight: 400;
      line-height: .95;
      letter-spacing: -.035em;
    }
    .meta {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      line-height: 1.7;
      text-align: right;
      white-space: nowrap;
    }
    .sequence {
      width: min(92vw, 1440px);
      margin: 0 auto;
      padding-bottom: 18vh;
    }
    figure {
      margin-bottom: clamp(90px, 14vw, 220px);
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
    }
    .wide {
      width: 100%;
    }
    .large {
      width: min(84vw, 1120px);
      margin-left: auto;
      margin-right: auto;
    }
    .medium-left {
      width: min(64vw, 820px);
      margin-right: auto;
    }
    .medium-right {
      width: min(64vw, 820px);
      margin-left: auto;
    }
    .small-center {
      width: min(42vw, 520px);
      margin-left: auto;
      margin-right: auto;
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(20px, 5vw, 90px);
      align-items: center;
      margin-bottom: clamp(90px, 14vw, 220px);
    }
    .pair figure {
      margin: 0;
    }
    .pair.offset {
      grid-template-columns: .78fr 1.22fr;
      align-items: end;
    }
    .pair.reverse {
      grid-template-columns: 1.2fr .8fr;
      align-items: start;
    }
    .closing {
      width: min(92vw, 1320px);
      margin: 4vh auto 10vh;
      padding-top: 8vh;
      border-top: 1px solid #dedede;
      display: flex;
      justify-content: space-between;
      gap: 30px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      line-height: 1.7;
    }
    @media (max-width: 720px) {
      header { padding: 24px 6vw; }
      .intro {
        width: 88vw;
        margin: 8vh auto 15vh;
        display: block;
      }
      h1 {
        font-size: clamp(44px, 15vw, 70px);
      }
      .meta {
        text-align: left;
        margin-top: 28px;
      }
      .sequence {
        width: 88vw;
      }
      figure {
        margin-bottom: clamp(70px, 24vw, 130px);
      }
      .large,
      .medium-left,
      .medium-right,
      .small-center {
        width: 100%;
      }
      .pair,
      .pair.offset,
      .pair.reverse {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .pair {
        margin-bottom: clamp(70px, 24vw, 130px);
      }
      .closing {
        width: 88vw;
        display: block;
      }
      .closing p + p {
        margin-top: 18px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">← Home</a>
  </header>

  <main>
    <section class="intro">
      <h1>Installation 01</h1>
      <p class="meta">2024<br>Yame, Fukuoka, Japan</p>
    </section>

    <section class="sequence">
      <figure class="large">
        <img src="AmazonPhotos/installation01-1.jpeg" alt="Installation 01">
      </figure>

      <figure class="wide">
        <img src="AmazonPhotos/installation01-4.jpeg" alt="Installation 01">
      </figure>

      <div class="pair offset">
        <figure>
          <img src="AmazonPhotos/installation01-10.jpeg" alt="Installation 01">
        </figure>
        <figure>
          <img src="AmazonPhotos/installation01-20.jpeg" alt="Installation 01">
        </figure>
      </div>

      <figure class="medium-right">
        <img src="AmazonPhotos/installation01-22.jpg" alt="Installation 01">
      </figure>

      <figure class="wide">
        <img src="AmazonPhotos/installation01-25.jpeg" alt="Installation 01">
      </figure>

      <div class="pair reverse">
        <figure>
          <img src="AmazonPhotos/installation01-35.jpeg" alt="Installation 01">
        </figure>
        <figure>
          <img src="AmazonPhotos/installation01-36.jpeg" alt="Installation 01">
        </figure>
      </div>

      <figure class="medium-left">
        <img src="AmazonPhotos/installation01-37.jpeg" alt="Installation 01">
      </figure>

      <figure class="small-center">
        <img src="AmazonPhotos/installation01-38.jpeg" alt="Installation 01">
      </figure>
    </section>

    <footer class="closing">
      <p>Installation 01</p>
      <p>2024<br>Former Yame County Office<br>Fukuoka, Japan</p>
    </footer>
  </main>

</body>
</html>
