<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eika Ando</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 42px 5vw;
      z-index: 10000;
    }

    .logo {
      color: #222222;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: normal;
      transition: color 0.4s ease;
    }

    .menu-button {
      position: relative;
      width: 34px;
      height: 24px;

      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 10001;
    }

    .menu-button span,
    .menu-button::before,
    .menu-button::after {
      content: "";
      position: absolute;
      left: 0;

      width: 34px;
      height: 1px;
      background: #222222;

      transition:
        transform 0.4s ease,
        top 0.4s ease,
        opacity 0.4s ease,
        background 0.4s ease;
    }

    .menu-button::before {
      top: 3px;
    }

    .menu-button span {
      top: 11px;
    }

    .menu-button::after {
      top: 19px;
    }

    .menu-button.open span {
      opacity: 0;
    }

    .menu-button.open::before {
      top: 11px;
      transform: rotate(45deg);
    }

    .menu-button.open::after {
      top: 11px;
      transform: rotate(-45deg);
    }

    .menu-button.open span,
    .menu-button.open::before,
    .menu-button.open::after {
      background: #ffffff;
    }

    header.menu-open .logo {
      color: #ffffff;
    }

    .menu-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      background: #a8a393;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.4s ease,
        visibility 0.4s ease;
    }

    .menu-screen.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .menu-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .menu-links a {
      color: #ffffff;
      text-decoration: none;

      font-size: clamp(30px, 4vw, 46px);
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .social-links {
      position: absolute;
      bottom: 48px;

      display: flex;
      align-items: center;
      gap: 25px;
    }

    .social-links a {
      color: #ffffff;
      text-decoration: none;
    }

    .social-links svg {
      display: block;
      width: 29px;
      height: 29px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .home-content {
      background: #ffffff;
    }

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 150px 8vw 100px;
    }

    .hero img {
      display: block;
      width: min(62vw, 760px);
      max-height: 72vh;
      object-fit: contain;
    }

    .home-words {
      min-height: 100vh;

      display: flex;
      align-items: center;

      padding: 0 8vw;
    }

    .home-words p {
      max-width: 700px;
      margin: 0;

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(20px, 2.2vw, 28px);
      font-weight: normal;
      line-height: 1.9;
    }

    .home-photo {
      min-height: 130vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20vh 8vw;
    }

    .home-photo img {
      display: block;
      width: min(78vw, 620px);
      height: auto;
    }

    .home-ending {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 100px 8vw;
    }

    .home-ending a {
      color: #222222;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2.5vw, 30px);

      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 7px;
    }

    @media (max-width: 700px) {
      header {
        padding: 28px 7vw;
      }

      .logo {
        font-size: 19px;
      }

      .hero {
        padding: 100px 0 100px;
      }

      .hero img {
        width: 72vw;
        max-height: none;
      }

      .home-words {
        padding: 0 10vw;
      }

      .home-photo {
        padding: 18vh 8vw;
      }

      .home-photo img {
        width: 82vw;
      }

      .menu-links {
        gap: 28px;
      }

      .menu-links a {
        font-size: 40px;
      }

      .social-links {
        bottom: 38px;
      }
    }
  </style>
</head>

<body>

  <header id="siteHeader">
    <div class="logo">Eika Ando</div>

    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="メニューを開く"
      aria-expanded="false"
      aria-controls="menuScreen"
    >
      <span></span>
    </button>
  </header>

  <div class="menu-screen" id="menuScreen">

    <nav class="menu-links" aria-label="メインメニュー">
      <a href="about.html">about</a>
      <a href="installation.html">installation</a>
      <a href="work.html">work</a>
      <a href="contact.html">contact</a>
    </nav>

    <div class="social-links">

      <a href="mailto:" aria-label="メール">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="1"></rect>
          <path d="M4 7l8 6 8-6"></path>
        </svg>
      </a>

      <a href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1"></circle>
        </svg>
      </a>

    </div>

  </div>

  <main class="home-content">

    <section class="hero">
      <img src="images/hero-new.jpg" alt="植物の写真">
    </section>

    <section class="home-words">
      <p>ここに、詩のような一言</p>
    </section>

    <section class="home-photo">
      <img src="images/hero.jpeg" alt="インスタレーション作品">
    </section>

    <section class="home-ending">
      <a href="contact.html">Eika Ando</a>
    </section>

  </main>

  <script>
    const menuButton = document.getElementById("menuButton");
    const menuScreen = document.getElementById("menuScreen");
    const siteHeader = document.getElementById("siteHeader");
    const menuLinks = document.querySelectorAll(".menu-links a");

    function closeMenu() {
      menuButton.classList.remove("open");
      menuScreen.classList.remove("open");
      siteHeader.classList.remove("menu-open");
      document.body.classList.remove("menu-open");

      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "メニューを開く");
    }

    menuButton.addEventListener("click", function () {
      const isOpen = menuScreen.classList.toggle("open");

      menuButton.classList.toggle("open", isOpen);
      siteHeader.classList.toggle("menu-open", isOpen);
      document.body.classList.toggle("menu-open", isOpen);

      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "メニューを閉じる" : "メニューを開く"
      );
    });

    menuLinks.forEach(function (link) {
      link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeMenu();
      }
    });
  </script>

</body>
</html>
